<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 40">
  <defs>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- 4-pointed star shape (Gemini mark) -->
  <g transform="translate(18, 20)">
    <!-- Vertical elongated lobe -->
    <path d="M0,-14 C1.5,-7 1.5,7 0,14 C-1.5,7 -1.5,-7 0,-14 Z" fill="url(#geminiGrad)"/>
    <!-- Horizontal elongated lobe -->
    <path d="M-14,0 C-7,1.5 7,1.5 14,0 C7,-1.5 -7,-1.5 -14,0 Z" fill="url(#geminiGrad)"/>
  </g>
  <!-- Gemini text -->
  <text x="40" y="26" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="17" fill="#4285F4" letter-spacing="-0.2">Gemini</text>
</svg>
