<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 40">
  <!-- Meta infinity loop mark (two overlapping ovals forming ∞) -->
  <g transform="translate(22, 20)">
    <!-- Left oval -->
    <ellipse cx="-8" cy="0" rx="10" ry="7" fill="none" stroke="#0082FB" stroke-width="3"/>
    <!-- Right oval -->
    <ellipse cx="8" cy="0" rx="10" ry="7" fill="none" stroke="#0082FB" stroke-width="3"/>
  </g>
  <!-- Llama text -->
  <text x="44" y="26" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="17" fill="#0082FB" letter-spacing="-0.2">Llama</text>
</svg>
