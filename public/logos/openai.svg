    <path d="M0,-11 C2,-11 4,-9 4,-7 L4,7 C4,9 2,11 0,11 C-2,11 -4,9 -4,7 L-4,-7 C-4,-9 -2,-11 0,-11 Z" fill="#000" transform="rotate(0)"/>
