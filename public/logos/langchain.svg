    <!-- Right link -->
    <circle cx="10" cy="4" r="7" fill="none" stroke="#1C3C3C" stroke-width="3"/>
  </g>
  <!-- LangChain text -->
  <text x="32" y="26" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" fill="#1C3C3C" letter-spacing="-0.2">LangChain</text>
